<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PitchCount</title>
<meta name="theme-color" content="#f6f5f0">
<meta name="description" content="1球ずつタップして数える、少年野球の無料の球数カウンター。学童・中学・高校・ボーイズ・リトルの球数制限に合わせて、今日あと何球投げられるか、次はいつ投げられるかがすぐ分かります。登録なし、データは端末の中だけ。">
<meta property="og:type" content="website">
<meta property="og:title" content="PitchCount">
<meta property="og:description" content="1球ずつタップして数える、少年野球の無料の球数カウンター。団体の球数制限に合わせて、今日あと何球、次はいつ投げられるかがすぐ分かります。登録なし、データは端末の中だけ。">
<meta property="og:url" content="https://yatti3g-byte.github.io/PitchCount/">
<meta property="og:image" content="https://yatti3g-byte.github.io/PitchCount/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* VOICE: a quiet bench tool, same family as TapScore / FormNote / ShotFind.
   IDEA: the manager's pitch-count card: one big counter, a board of who can pitch today.
   PICTURE: the giant tap button itself, coloured by how close the pitcher is to the limit.
   COLOUR and TYPE: TapScore's brand: warm off-white, white cards, green primary, lamp yellow/red; system Japanese sans.
   LAYOUT: one 540px column, tabs on top, everything pressed lives in the lower half on the count screen. */
:root{
  --paper:#f6f5f0;--surface:#fff;--ink:#1f2a22;--muted:#6b756e;--line:#d9d8d0;--accent2:#e8f3ec;--wn:#fff4d6;
  --accent:#2f7d4f;--accent-ink:#fff;--lamp-s:#e0b000;--lamp-o:#d8432e;--hit:#c2402d;--ov:#fde8e4;
  --font:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141a16;--surface:#1e2721;--ink:#e8ede9;--muted:#98a49b;--line:#33423a;--accent2:#25382c;--wn:#3a3418;
  --accent:#58b87e;--accent-ink:#14201c;--lamp-s:#f0c21a;--lamp-o:#ef5a44;--hit:#ff7a66;--ov:#3d201b;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#141a16;--surface:#1e2721;--ink:#e8ede9;--muted:#98a49b;--line:#33423a;--accent2:#25382c;--wn:#3a3418;
  --accent:#58b87e;--accent-ink:#14201c;--lamp-s:#f0c21a;--lamp-o:#ef5a44;--hit:#ff7a66;--ov:#3d201b;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.6 var(--font);-webkit-text-size-adjust:100%;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#main{max-width:540px;margin:0 auto;padding:12px 14px 40px;display:flex;flex-direction:column;gap:12px}
.mast{display:flex;align-items:center;justify-content:space-between;gap:8px}
.apphead{display:flex;align-items:center;gap:8px}
.apphead .series-tag{display:block;font-size:12px;color:var(--muted);font-weight:400;line-height:1.3}
.applogo{flex:none}.applogo .lb{fill:#cfe3d6}.applogo .lh{fill:#2f7d4f}.applogo .lp{fill:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .applogo .lb{fill:#33423a}:root:not([data-theme=light]) .applogo .lh{fill:#58b87e}}
:root[data-theme=dark] .applogo .lb{fill:#33423a}:root[data-theme=dark] .applogo .lh{fill:#58b87e}
.mast h1{font-size:20px;font-weight:700;margin:4px 0 0;line-height:1.2}
.mast small{color:var(--muted);font-size:13px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{border:0;background:none;border-radius:7px;padding:8px 0;font-weight:700;color:var(--muted);min-height:40px}
.tabs button[aria-selected="true"]{background:var(--accent2);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
h2{font-size:16px;font-weight:700;margin:6px 0 0}
p{margin:0}
.muted{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700;min-height:48px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--hit);border-color:var(--hit)}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:4px 12px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px}.row>.btn{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.banner{background:var(--wn);border-radius:10px;padding:10px 12px;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:20px 0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fld input,.fld select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;min-height:44px;color:var(--ink);font-size:16px;width:100%}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;min-height:44px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent2);color:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.chip small{font-size:12px;color:var(--muted)}
.chip.no{opacity:.75}.chip.no small{color:var(--hit)}

/* board */
.dbar{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:6px}
.dbar button{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700}
.dbar .d{text-align:center;font-weight:700;font-size:17px}
.dbar .d small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pc{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.pc.warn{border-left-color:var(--lamp-s)}.pc.over{border-left-color:var(--lamp-o)}
.no{display:grid;place-items:center;min-width:38px;height:38px;border-radius:10px;background:var(--accent2);color:var(--accent);font-weight:800;font-size:16px;grid-row:1/3}
.pc .nm{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .rem{grid-row:1/3;grid-column:3;text-align:right;white-space:nowrap}
.pc .rem b{font-size:24px;font-variant-numeric:tabular-nums}
.pc .rem small{display:block;font-size:12px;color:var(--muted)}
.pc.over .rem b{font-size:16px;color:var(--hit)}
.pc .sub{font-size:12px;color:var(--muted)}
.meters{grid-column:1/-1;display:flex;flex-direction:column;gap:4px;margin-top:6px}
.mt{display:grid;grid-template-columns:4.6em minmax(0,1fr) 5.4em;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.mt i{display:block;height:8px;border-radius:99px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.mt i span{display:block;height:100%;background:var(--accent)}
.mt.warn i span{background:var(--lamp-s)}.mt.over i span{background:var(--lamp-o)}
.mt b{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.why{grid-column:1/-1;font-size:13px;margin-top:4px}
.pc.over .why{color:var(--hit);font-weight:700}

/* count */
.live{display:flex;flex-direction:column;gap:10px}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lhead b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tap{width:100%;min-height:min(46vh,380px);border:0;border-radius:22px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;user-select:none;-webkit-user-select:none;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .06s}
.tap:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.tap .who{font-size:16px;font-weight:700;opacity:.9}
.tap .n{font-size:clamp(84px,26vw,132px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.tap .plus{font-size:15px;font-weight:700;opacity:.9}
.tap.warn{background:var(--lamp-s);color:#2a2104}
.tap.over{background:var(--lamp-o)}
.tap:disabled{background:var(--line);color:var(--muted);box-shadow:none}
.state{text-align:center;font-size:15px;font-weight:700;min-height:1.6em}
.state.over{color:var(--hit)}
.sess{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.sess li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:6px 2px;font-size:14px}
.sess li:last-child{border-bottom:0}
.sess b{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.tap{transition:none}.tap:active{transform:none}}

/* history */
.hday{font-weight:700;font-size:14px;margin:8px 0 2px}
.hrow{width:100%;display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px}
.hrow small{color:var(--muted);font-size:12px;margin-left:6px}
.hrow b{font-variant-numeric:tabular-nums;white-space:nowrap}
.hlist{display:flex;flex-direction:column;gap:6px}

/* settings */
.rules{display:flex;flex-direction:column;gap:6px}
.rule{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:56px}
.rule b{display:block;font-size:15px}.rule small{display:block;color:var(--muted);font-size:12px}
.rule.on{background:var(--accent2);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.src{font-size:12px;color:var(--muted);margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.src a{color:var(--accent)}
details summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:14px;padding:6px 0}
textarea{width:100%;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--paper);color:var(--ink);resize:vertical}
.sister a{color:var(--accent);font-weight:700;text-decoration:none}
.helpl{font-size:13px;color:var(--accent);font-weight:700;text-decoration:none;white-space:nowrap}
.samplebar{display:flex;align-items:center;gap:10px;background:var(--accent2);border:1px solid var(--accent);border-radius:12px;padding:8px 12px;font-size:13px}
.samplebar span{flex:1}.samplebar .btn{min-height:40px;flex:none}
#tour{position:fixed;inset:0;z-index:200}
#tour.do{pointer-events:none}#tour.do .tcard{pointer-events:auto}#tour.do .tspot{outline-color:#ffd23f;animation:tpulse 1.2s ease-in-out infinite}
@keyframes tpulse{50%{outline-offset:4px}}
#tour .tmask{position:absolute;inset:0}#tour .tmask.dim{background:rgba(20,28,22,.62)}
#tour .tspot{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(20,28,22,.62);outline:3px solid #fff;transition:all .2s ease;pointer-events:none}
#tour .tcard{position:fixed;left:12px;right:12px;max-width:520px;margin:0 auto;background:#2f7d4f;color:#fff;border-radius:16px;padding:14px 16px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#tour .tcard h3{margin:0 0 4px;font-size:17px}
#tour .tcard p{margin:0 0 10px;font-size:15px;line-height:1.65}
#tour .tcard .tn{float:right;font-size:13px;opacity:.8;font-weight:700}
#tour .tbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#tour .tbar .link{margin-right:auto;background:none;border:0;color:#fff;opacity:.85;text-decoration:underline;font-size:14px;padding:8px 0}
#tour .tbar .btn{min-height:44px;padding:8px 16px;background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
#tour .tbar .btn.primary{background:#fff;color:#2f7d4f;border-color:#fff}
@media (prefers-reduced-motion:reduce){#tour .tspot{transition:none;animation:none}}
.coffee{display:block;margin-top:14px;padding:8px 0;font-size:13px;color:var(--muted);text-decoration:none;text-align:center}
.linebtn{background:#06c755;color:#fff;border-color:#06c755;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}

/* AIに相談（TapScore と同じ形） */
.consult{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px 12px;display:flex;flex-direction:column;gap:8px}
.consult h2{margin-top:12px}
.consult .lab{font-size:13px;color:var(--muted);font-weight:700;margin-top:4px}
.sched{display:flex;flex-direction:column;gap:6px}
.sg{display:grid;grid-template-columns:minmax(0,9.5em) 6em minmax(0,1fr) 44px;gap:6px;align-items:center}
.sg input,.sg select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px;min-height:44px;font-size:16px;color:var(--ink);width:100%}
.sg button{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--hit);font-weight:700}
@media (max-width:420px){.sg{grid-template-columns:minmax(0,1fr) 6em 44px}.sg input[data-cg="m"]{grid-column:1/3;grid-row:2}}
.chip.ex{background:var(--ov);border-color:var(--hit);color:var(--hit);text-decoration:line-through}
.ck{display:flex;gap:8px;align-items:center;font-size:15px}.ck input{width:20px;height:20px;accent-color:var(--accent)}
.cqin{width:100%;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.cqtext{font-size:13px;line-height:1.55}
.aimsg{min-height:1.3em;font-size:13px;font-weight:700;color:var(--accent)}

#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,16,12,.55)}
#sheet[hidden]{display:none}
.panel{background:var(--surface);width:100%;max-width:540px;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:18px}
#toast{position:fixed;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<main id="main"></main>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
{
const KEY='pitchcount-v1',CHECKED='2026年11月26日';
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);};
const WD='日月火水木金土';
const md=s=>{const d=new Date(s+'T00:00:00');return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')';};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- 団体ごとの球数ルール（数字はアプリの中でも確認できるように出典を付ける） ---------- */
const LLREST=n=>n>=66?4:n>=51?3:n>=36?2:n>=21?1:0;
const RULES={
  gakudo:{name:'学童（全日本軟式野球連盟）',desc:'1日70球・1週間210球（4年生以下は60球・180球）',finish:true,balk:true,
    classes:[['','5・6年生'],['low','4年生以下']],lim:p=>p.cls==='low'?{day:60,week:180}:{day:70,week:210}},
  chu:{name:'中学軟式（全日本軟式野球連盟 少年部）',desc:'1日100球・1週間350球',finish:true,balk:true,lim:()=>({day:100,week:350})},
  koko:{name:'高校（日本高等学校野球連盟）',desc:'1週間500球（対象は公式大会。アプリは直近7日間で計算）',finish:true,lim:()=>({week:500})},
  boys:{name:'ボーイズリーグ（日本少年野球連盟）',desc:'1日80球・連続2日で120球。連続2日で80球を超えたら3日目は投げられない。3連投は1日40球まで、4連投は禁止',lim:()=>({day:80,two:120,boys:true})},
  little:{name:'リトルリーグ',desc:'1日85球（マイナー75球、インターメディエート95球）と休養日',finish:true,
    classes:[['major','メジャー（小5〜中1前半）'],['minor','マイナー（小4以下）'],['inter','インターメディエート']],
    lim:p=>({day:p.cls==='minor'?75:p.cls==='inter'?95:85,rest:LLREST})},
  custom:{name:'自分で決める',desc:'1日・連続2日・1週間の上限を入力（大会ルールやチームの約束）',lim:()=>({day:+D.custom.day||0,two:+D.custom.two||0,week:+D.custom.week||0})}
};

let D={v:1,rule:'',custom:{day:'',two:'',week:''},players:[],outings:[],live:null};
let noStore=false;
// 保存データ・控えファイルの中身を確かめて、使える形だけを取り出す（壊れた行は捨てる）
function cleanData(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.players))return null;
  const okId=x=>typeof x==='string'&&/^[A-Za-z0-9_-]{1,40}$/.test(x),seen=new Set();
  const realDay=x=>{if(typeof x!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(x))return false;const t=new Date(x+'T00:00:00');return !isNaN(t)&&ymd(t)===x;};
  const players=d.players.filter(p=>p&&okId(p.id)&&!seen.has(p.id)&&seen.add(p.id)&&typeof p.name==='string'&&p.name.trim())
    .map(p=>({id:p.id.slice(0,40),name:p.name.trim().slice(0,16),no:String(p.no==null?'':p.no).slice(0,4),cls:typeof p.cls==='string'?p.cls:'',...(p.sample?{sample:true}:{})}));
  const ids=new Set(players.map(p=>p.id));
  const outings=(Array.isArray(d.outings)?d.outings:[]).filter(o=>o&&ids.has(o.pid)&&realDay(o.date)&&Number.isInteger(o.n)&&o.n>0&&o.n<=300)
    .map(o=>{const x={id:okId(o.id)?o.id:uid(),pid:o.pid,date:o.date,n:o.n,opp:String(o.opp||'').slice(0,20)};if(okId(o.sid))x.sid=o.sid;if(o.sample)x.sample=true;return x;});
  const num=v=>{const n=parseInt(v,10);return n>0?String(Math.min(999,n)):'';},c=d.custom||{};
  const L=d.live,live=L&&okId(L.id)&&realDay(L.date)?{id:L.id,date:L.date,opp:String(L.opp||'').slice(0,20),cur:ids.has(L.cur)?L.cur:null,hist:(Array.isArray(L.hist)?L.hist:[]).filter(x=>ids.has(x)),...(L.sample?{sample:true}:{})}:null;
  const out={v:1,rule:RULES[d.rule]?d.rule:'',custom:{day:num(c.day),two:num(c.two),week:num(c.week)},players,outings,live};
  if(d.cq&&Array.isArray(d.cq.games))out.cq={q:String(d.cq.q||'plan'),games:d.cq.games.filter(g=>g&&realDay(g.d)).map(g=>({d:g.d,n:[1,2,3].indexOf(+g.n)>=0?+g.n:1,m:String(g.m||'').slice(0,12)})),
    feel:String(d.cq.feel||'').slice(0,80),free:String(d.cq.free||'').slice(0,300),hide:d.cq.hide!==false,ex:(Array.isArray(d.cq.ex)?d.cq.ex:[]).filter(x=>ids.has(x))};
  return out;
}
try{const v=cleanData(JSON.parse(localStorage.getItem(KEY)||'null'));if(v)D=v;}catch(e){noStore=true;}

function vib(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
const rule=()=>RULES[D.rule]||null;

/* ---------- 計算 ---------- */
function lim(p){const R=rule();if(!R)return {day:0,two:0,week:0,rest:null};const L=R.lim(p);return {day:L.day||0,two:L.two||0,week:L.week||0,rest:L.rest||null,boys:!!L.boys};}
function used(pid,a,b){let s=0;for(const o of D.outings)if(o.pid===pid&&o.date>=a&&o.date<=b)s+=o.n;return s;}
function stat(p,date){
  const L=lim(p),items=[];
  if(L.day)items.push({k:'今日',u:used(p.id,date,date),l:L.day});
  if(L.two)items.push({k:'連続2日',u:used(p.id,addDays(date,-1),date),l:L.two});
  if(L.week)items.push({k:'7日間',u:used(p.id,addDays(date,-6),date),l:L.week});
  let bind=null;items.forEach(i=>{i.r=i.l-i.u;if(!bind||i.r<bind.r)bind=i;});
  let rest=null;
  if(L.rest){const by={};D.outings.forEach(o=>{if(o.pid===p.id&&o.date<date)by[o.date]=(by[o.date]||0)+o.n;});
    Object.keys(by).forEach(d0=>{const rd=L.rest(by[d0]),from=addDays(d0,rd+1);if(rd&&from>date&&(!rest||from>rest.from))rest={from,n:by[d0],d:d0,rd};});}
  // ボーイズ：連続2日で80球を超えたら3日目は禁止、3連投は1日40球まで、4連投は禁止
  let ban=null;
  if(L.boys){const u=k=>used(p.id,addDays(date,-k),addDays(date,-k)),d1=u(1),d2=u(2),d3=u(3);
    if(d1&&d2&&d3)ban={why:'前の3日間続けて投げているので、4連投になる今日は投げられません'};
    else if(d1&&d2&&d1+d2>80)ban={why:'前の2日間で'+(d1+d2)+'球（80球超）投げているので、3日目の今日は投げられません'};
    else if(d1&&d2){const x={k:'3連投',u:used(p.id,date,date),l:40};x.r=x.l-x.u;items.push(x);if(!bind||x.r<bind.r)bind=x;}}
  const rem=bind?Math.max(0,bind.r):Infinity;
  return {items,bind,rem,rest,ban,blocked:!!rest||!!ban||rem<=0,dayU:used(p.id,date,date)};
}
function level(s){if(s.blocked)return 'over';return s.bind&&s.bind.u/s.bind.l>=0.8?'warn':'ok';}
function next(p,date){for(let i=1;i<=21;i++){const d=addDays(date,i),s=stat(p,d);if(!s.blocked)return {d,rem:s.rem};}return null;}
function why(p,s,date){
  if(s.rest)return s.rest.n+'球投げた（'+md(s.rest.d)+'）ので休養日が必要。'+md(s.rest.from)+'から投げられます';
  if(s.ban){const n=next(p,date);return s.ban.why.replace('今日',md(date))+(n?'。次は'+md(n.d)+'から':'');}
  if(s.rem<=0){const n=next(p,date);return s.bind.k+'の上限'+s.bind.l+'球に達しています'+(n?'。次は'+md(n.d)+'から（'+(n.rem===Infinity?'制限なし':'最大'+n.rem+'球')+'）':'');}
  return '';
}
const remText=s=>s.rem===Infinity?'制限なし':'あと'+s.rem+'球';

    '<nav class="tabs" role="tablist">'+tabs.map(t=>'<button role="tab" data-act="tab" data-v="'+t[0]+'" aria-selected="'+(ui.view===t[0])+'">'+t[1]+(t[0]==='count'&&D.live?' ●':'')+'</button>').join('')+'</nav>';

  {n:'TapScore',url:'https://yatti3g-byte.github.io/TapScore/',d:'1球ずつタップして記録するスコアブック'},

function meter(i){const r=Math.min(1,i.u/i.l),lv=i.u>=i.l?'over':r>=.8?'warn':'ok';
  return '<div class="mt '+lv+'"><span>'+i.k+'</span><i><span style="width:'+(r*100).toFixed(0)+'%"></span></i><b>'+i.u+' / '+i.l+'</b></div>';}
function clsName(p){const R=rule();if(!R||!R.classes)return '';const c=R.classes.find(c=>c[0]===(p.cls||''))||R.classes[0];return '・'+c[1];}
function clsSelect(v,id){const R=rule();if(!R||!R.classes)return '';
  return '<label class="fld">区分<select id="'+id+'">'+R.classes.map(c=>'<option value="'+c[0]+'"'+(c[0]===(v||R.classes[0][0])?' selected':'')+'>'+c[1]+'</option>').join('')+'</select></label>';}

function count(){
  if(!D.players.length)return '<section class="card"><h2>先に投手を登録してください</h2></section>'+playerForm();
  const L=D.live;
  if(!L){
    return '<form class="card" data-form="start" style="display:flex;flex-direction:column;gap:10px"><h2>試合を始める</h2>'+
      '<div class="grid2"><label class="fld">日付<input type="date" id="st-date" value="'+today()+'"></label><label class="fld">相手・メモ<input id="st-opp" maxlength="20" placeholder="例：〇〇少年野球"></label></div>'+
      '<div class="fld">先発投手</div><div class="chips" id="st-chips">'+pitcherChips(ui.pick,today(),'pick')+'</div>'+
      '<button class="btn primary">カウントを始める</button></form><p class="muted">けん制や野手への送球は数えません。'+(rule().balk?'ボークでも投げた球は数えます（全軟連の運用）。':'ボークの球を数えるかは、大会要項で確かめてください。')+'</p>';
  }
  const p=pl(L.cur);let h='<div class="live"><div class="lhead"><b>'+md(L.date)+(L.opp?' vs '+esc(L.opp):'')+'</b><button class="btn sm" data-act="finish">試合終了</button></div>';
  h+='<div class="chips" aria-label="投手">'+pitcherChips(L.cur,L.date,'cur')+'</div>';
  if(!p){h+='<p class="empty">投げている投手を選んでください</p></div>';return h;}
  const s=stat(p,L.date),lv=level(s),n=sessN(p.id);
  let st='';
  if(s.rest)st='休養日の投手です（'+md(s.rest.from)+'から投げられます）';
  else if(s.ban)st=s.ban.why.replace('今日',md(L.date));
  else if(s.rem<=0){const over=s.bind.u-s.bind.l;st=s.bind.k+'の上限'+s.bind.l+'球に'+(over>0?'達し、'+over+'球超えています':'達しました')+(rule().finish?'。規定では、その打者との対戦が終わるまで続投が認められています':'');}
  else st=remText(s)+(s.bind?'（'+s.bind.k+'の上限'+s.bind.l+'球）':'');
  h+='<button class="tap '+lv+'" data-act="plus" aria-label="1球数える"><span class="who">'+esc(label(p))+'</span><span class="n">'+n+'</span><span class="plus">タップで ＋1球</span></button>';
  h+='<p class="state '+lv+'">'+esc(st)+'</p>';
  h+='<div class="row"><button class="btn" data-act="minus"'+(L.hist.length?'':' disabled')+'>1球取り消す</button><button class="btn" data-act="adj">球数を修正</button></div>';
  if(s.items.length||s.dayU!==n)h+='<section class="card cmeters"><div class="meters" style="margin:0">'+s.items.map(meter).join('')+'</div>'+(s.dayU!==n?'<p class="muted" style="margin-top:6px">この日の合計 '+s.dayU+'球（ほかの試合を含む）</p>':'')+'</section>';
  const ids=sessIds();
  if(ids.length)h+='<section class="card"><h2>この試合</h2><ul class="sess">'+ids.map(id=>'<li><span>'+esc(label(pl(id)))+'</span><b>'+sessN(id)+'球</b></li>').join('')+'</ul></section>';
  return h+'</div>';
}
function pitcherChips(cur,date,act){
  return D.players.map(p=>{const s=stat(p,date),n=D.live?sessN(p.id):0;
    return '<button type="button" class="chip'+(p.id===cur?' on':'')+(s.blocked&&p.id!==cur?' no':'')+'" data-act="'+act+'" data-id="'+esc(p.id)+'">'+esc(label(p))+'<small>'+(n?n+'球':s.blocked?'不可':s.rem===Infinity?'':'あと'+s.rem)+'</small></button>';}).join('');
}
const sessOut=pid=>D.outings.find(o=>o.sid===D.live.id&&o.pid===pid);
const sessN=pid=>{const o=sessOut(pid);return o?o.n:0;};
const sessIds=()=>D.outings.filter(o=>o.sid===D.live.id&&o.n>0).map(o=>o.pid);

function addPitch(pid,delta){
  const L=D.live;let o=sessOut(pid);
  if(!o){if(delta<0)return;o={id:uid(),sid:L.id,pid,date:L.date,opp:L.opp,n:0};if(L.sample)o.sample=true;D.outings.push(o);}
  o.n=Math.max(0,o.n+delta);if(!o.n)D.outings=D.outings.filter(x=>x!==o);
}
function plus(){
  const L=D.live,p=pl(L&&L.cur);if(!p)return;
  const t=Date.now();if(t-(ui.tapAt||0)<400)return;ui.tapAt=t;   // 指が2回当たったときの二重加算を防ぐ
  const b=level(stat(p,L.date));addPitch(p.id,1);L.hist.push(p.id);save();
  const s=stat(p,L.date),a=level(s);
  if(a!==b&&a==='warn'){vib([80]);toast('上限の8割です：'+remText(s));}
  else if(a!==b&&a==='over'){vib([250,120,250]);toast('上限に達しました'+(rule().finish?'。規定では、その打者との対戦が終わるまで続投が認められています':''));}
  else vib(15);
  render();
}
function minus(){const L=D.live;const pid=L.hist.pop();if(!pid)return;addPitch(pid,-1);L.cur=pid;save();vib([30,60,30]);toast('1球取り消しました（'+label(pl(pid))+' '+sessN(pid)+'球）');render();}

  const r=el.getBoundingClientRect(),pd=6,H=innerHeight;
  o.innerHTML=(st.do?'':'<div class="tmask"></div>')+'<div class="tspot" style="top:'+(r.top-pd)+'px;left:'+(r.left-pd)+'px;width:'+(r.width+pd*2)+'px;height:'+(r.height+pd*2)+'px"></div>'+card;
  const c=o.querySelector('.tcard'),ch=c.offsetHeight;
  if(r.bottom+pd+12+ch<=H)c.style.top=(r.bottom+pd+12)+'px';
  else if(r.top-pd-12-ch>=0)c.style.top=(r.top-pd-12-ch)+'px';
  else c.style.bottom='12px';
}

/* ---------- シート（確認・編集） ---------- */
function sheet(html){const s=$('#sheet');s.innerHTML='<div class="panel" role="dialog" aria-modal="true">'+html+'</div>';s.hidden=false;const f=s.querySelector('input');if(f)setTimeout(()=>f.focus(),50);}
function closeSheet(){$('#sheet').hidden=true;$('#sheet').innerHTML='';ui.sheet=null;}
function confirmSheet(msg,yes,fn,danger){ui.sheet={fn};sheet('<h3>'+esc(msg)+'</h3><div class="row"><button class="btn" data-act="close">やめる</button><button class="btn '+(danger?'danger':'primary')+'" data-act="yes">'+esc(yes)+'</button></div>');}
function shareSheet(text){
  ui.sheet={text};
  sheet('<h3>共有する</h3><textarea rows="8" readonly>'+esc(text)+'</textarea><div class="row"><a class="btn linebtn" href="https://line.me/R/share?text='+encodeURIComponent(text)+'" target="_blank" rel="noopener">LINEで送る</a><button class="btn" data-act="copy">コピー</button></div><button class="btn" data-act="close">閉じる</button>');
}

function boardText(d){return '【登板可否】'+md(d)+'\n'+D.players.map(p=>{const s=stat(p,d);
  return label(p)+'：'+(s.blocked?'投げられない'+(s.rest?'（'+md(s.rest.from)+'から）':(()=>{const n=next(p,d);return n?'（'+md(n.d)+'から）':'';})()):remText(s));}).join('\n')+'\n（'+shortRule()+'のルール・PitchCount）';}
function gameText(L){return '【球数】'+md(L.date)+(L.opp?' vs '+L.opp:'')+'\n'+D.outings.filter(o=>o.sid===L.id).map(o=>{const p=pl(o.pid),s=stat(p,L.date),n=next(p,L.date);
  return label(p)+' '+o.n+'球'+(n?'（次は'+md(n.d)+'から'+(n.rem===Infinity?'':'最大'+n.rem+'球')+'）':'');}).join('\n')+'\n（PitchCount）';}

let wake=null;
async function keepAwake(){try{if(!navigator.wakeLock||wake||document.visibilityState!=='visible')return;wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;});}catch(e){}}
function releaseWake(){if(wake){const w=wake;wake=null;try{w.release().catch(()=>{});}catch(e){}}}
document.addEventListener('visibilitychange',()=>{if(D.live&&ui.view==='count')keepAwake();});

/* ---------- 操作 ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  if(a==='tab'){ui.view=v;render();scrollTo(0,0);}
  else if(a==='rule'){D.rule=v;save();if(ui.view!=='settings')ui.view='board';toast(RULES[v].name+'のルールにしました');render();}
  else if(a==='day'){ui.date=v==='0'?today():addDays(ui.date,+v);render();}
  else if(a==='pick'){document.querySelectorAll('[data-act="pick"]').forEach(x=>x.classList.toggle('on',x===b));ui.pick=id;
    const p=pl(id),dt=($('#st-date')||{}).value||today(),s=stat(p,dt);if(s.blocked)toast(label(p)+'はこの日は投げられません：'+(why(p,s,dt)||'上限に達しています'));}
  else if(a==='cur'){if(id===D.live.cur)return;const p=pl(id),s=stat(p,D.live.date);
    const go=()=>{D.live.cur=id;save();render();const t=stat(p,D.live.date);toast(label(p)+'：この日'+t.dayU+'球・'+(t.blocked?'投げられない':remText(t)));};
    if(s.blocked)confirmSheet(label(p)+'は投げられない状態です（'+(why(p,s,D.live.date)||'上限に達しています')+'）。記録を直すときなどに限って、投手にしますか？','投手にする',go);else go();}
  else if(a==='cq'){cq().q=v;ui.cqEdited=null;ui.cqMsg='';save();render();if(v==='free'){const t=$('#cq-free');if(t)t.focus();}}
  else if(a==='cqex'){const o=cq(),i=o.ex.indexOf(id);if(i>=0)o.ex.splice(i,1);else o.ex.push(id);ui.cqEdited=null;save();render();}
  else if(a==='cqadd'){const o=cq(),last=o.games.length?o.games[o.games.length-1].d:today();o.games.push({d:addDays(last,1),n:1,m:''});ui.cqEdited=null;save();render();}
  else if(a==='cqdel'){cq().games.splice(+b.dataset.i,1);ui.cqEdited=null;save();render();}
  else if(a==='cqsend')cqSend();
  else if(a==='tour')tourStart();
  else if(a==='tnext')tourGo(1);
  else if(a==='tback')tourGo(-1);
  else if(a==='tend')tourEnd();
  else if(a==='sdel'){if(ui.tour){sampleDel();tourEnd();}else confirmSheet('見本の投手と記録を消しますか？自分で入れた記録は消えません。','見本を消す',sampleDel,true);}
  else if(a==='plus')plus();
  else if(a==='minus')minus();
  else if(a==='adj'){const p=pl(D.live.cur);if(!p)return;ui.sheet={adj:p.id};
    sheet('<h3>'+esc(label(p))+'の球数を直す</h3><label class="fld">この試合の球数<input id="adj-n" type="number" inputmode="numeric" min="0" max="300" value="'+sessN(p.id)+'"></label><div class="row"><button class="btn" data-act="close">やめる</button><button class="btn primary" data-act="adjok">直す</button></div>');}
  else if(a==='adjok'){const n=Math.max(0,Math.min(300,parseInt($('#adj-n').value,10)||0)),pid=ui.sheet.adj,cur=sessN(pid);addPitch(pid,n-cur);D.live.hist=D.live.hist.filter(x=>x!==pid);save();closeSheet();toast('球数を'+n+'球にしました');render();}
  else if(a==='finish'){const L=D.live;
    confirmSheet('試合終了にしますか？（記録は履歴に残ります）','試合終了',()=>{const t=gameText(L);D.live=null;save();ui.view='board';ui.date=L.date;render();if(D.outings.some(o=>o.sid===L.id))shareSheet(t);});}
  else if(a==='shareBoard')shareSheet(boardText(ui.date));
  else if(a==='copy'){try{await navigator.clipboard.writeText(ui.sheet.text);toast('コピーしました');}catch(_){const t=$('#sheet textarea');t.select();toast('文字を選びました。長押しでコピーしてください');}}
  else if(a==='close')closeSheet();
  else if(a==='yes'){const f=ui.sheet&&ui.sheet.fn;closeSheet();f&&f();}
  else if(a==='editp'){const p=pl(id);ui.sheet={pid:id};
    sheet('<h3>投手を編集</h3><div class="grid2" style="grid-template-columns:5.5em minmax(0,1fr)"><label class="fld">背番号<input id="ep-no" inputmode="numeric" maxlength="4" value="'+esc(p.no)+'"></label><label class="fld">名前<input id="ep-name" maxlength="16" value="'+esc(p.name)+'"></label></div>'+clsSelect(p.cls,'ep-cls')+
      '<div class="row"><button class="btn" data-act="close">やめる</button><button class="btn primary" data-act="epok">保存</button></div><button class="btn danger" data-act="delp">この投手を削除</button>');}
  else if(a==='epok'){const p=pl(ui.sheet.pid),nm=$('#ep-name').value.trim();if(!nm){toast('名前を入れてください');return;}p.name=nm;p.no=$('#ep-no').value.trim();const c=$('#ep-cls');if(c)p.cls=c.value;save();closeSheet();render();}
  else if(a==='delp'){const p=pl(ui.sheet.pid);confirmSheet(label(p)+'を削除しますか？登板の記録も消えます。','削除する',()=>{D.players=D.players.filter(x=>x!==p);D.outings=D.outings.filter(o=>o.pid!==p.id);if(D.live&&D.live.cur===p.id)D.live.cur=null;if(D.live)D.live.hist=D.live.hist.filter(x=>x!==p.id);save();render();},true);}
  else if(a==='addo'){if(!D.players.length){toast('先に投手を登録してください');return;}ui.sheet={};
    sheet('<h3>登板を追加</h3><div class="grid2"><label class="fld">日付<input type="date" id="ao-date" value="'+today()+'"></label><label class="fld">球数<input id="ao-n" type="number" inputmode="numeric" min="1" max="300"></label></div><label class="fld">投手<select id="ao-p">'+D.players.map(p=>'<option value="'+esc(p.id)+'">'+esc(label(p))+'</option>').join('')+'</select></label><label class="fld">相手・メモ<input id="ao-opp" maxlength="20"></label><div class="row"><button class="btn" data-act="close">やめる</button><button class="btn primary" data-act="aook">追加</button></div>');}
  else if(a==='aook'){const n=parseInt($('#ao-n').value,10),d=$('#ao-date').value;if(!(n>0&&n<=300)||!d){toast('日付と球数を入れてください');return;}
    D.outings.push({id:uid(),pid:$('#ao-p').value,date:d,n,opp:$('#ao-opp').value.trim()});save();closeSheet();toast('追加しました');render();}
  else if(a==='edito'){const o=D.outings.find(x=>x.id===id);if(!o)return;ui.sheet={oid:id};
    sheet('<h3>'+esc(label(pl(o.pid)))+'　'+md(o.date)+'</h3><div class="grid2"><label class="fld">日付<input type="date" id="eo-date" value="'+o.date+'"></label><label class="fld">球数<input id="eo-n" type="number" inputmode="numeric" min="1" max="300" value="'+o.n+'"></label></div><label class="fld">相手・メモ<input id="eo-opp" maxlength="20" value="'+esc(o.opp||'')+'"></label><div class="row"><button class="btn" data-act="close">やめる</button><button class="btn primary" data-act="eook">保存</button></div><button class="btn danger" data-act="delo">この登板を削除</button>');}
  else if(a==='eook'){const o=D.outings.find(x=>x.id===ui.sheet.oid),n=parseInt($('#eo-n').value,10),d=$('#eo-date').value;if(!(n>0&&n<=300)||!d){toast('日付と球数を入れてください');return;}
    o.n=n;o.opp=$('#eo-opp').value.trim();if(!(D.live&&o.sid===D.live.id))o.date=d;save();closeSheet();render();}
  else if(a==='delo'){const oid=ui.sheet.oid;confirmSheet('この登板を削除しますか？','削除する',()=>{const o=D.outings.find(x=>x.id===oid);D.outings=D.outings.filter(x=>x.id!==oid);if(D.live&&o)D.live.hist=D.live.hist.filter(x=>x!==o.pid||o.sid!==D.live.id);save();render();},true);}
  else if(a==='export'){const txt=JSON.stringify({app:'PitchCount',v:1,at:Date.now(),data:D}),name='pitchcount-'+today()+'.json';
    // スマホ：TapScore と同じく共有画面（Googleドライブ・iCloud・LINEのKeepなど）へ送る
    if(window.self===window.top&&navigator.canShare&&matchMedia('(pointer:coarse)').matches){try{const f=new File([txt],name,{type:'application/json'});
      if(navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'PitchCountの控え'});toast('控えのファイルを送りました。ドライブやLINEのKeepなどに保存しておいてください');}
        catch(e2){if(!(e2&&e2.name==='AbortError'))toast('送れませんでした。もう一度お試しください');}return;}}catch(_){}}
    let ok=false;try{const u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);ok=true;}catch(_){}
    ui.sheet={text:txt};sheet('<h3>控え</h3><p class="muted">'+(ok?'ファイルを保存しました。保存されないときは、下の文字をコピーしてメモなどに残してください。':'下の文字をコピーして、メモなどに残してください。')+'</p><textarea rows="5" readonly>'+esc(txt)+'</textarea><div class="row"><button class="btn" data-act="copy">コピー</button><button class="btn" data-act="close">閉じる</button></div>');}
  else if(a==='wipe')confirmSheet('すべての投手と記録を消しますか？元に戻せません。','すべて消す',()=>{D={v:1,rule:D.rule,custom:D.custom,players:[],outings:[],live:null};save();ui.view='board';render();},true);
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target.dataset.form;
  if(f==='addp'){const nm=$('#np-name').value.trim();if(!nm)return;const c=$('#np-cls');D.players.push({id:uid(),name:nm,no:$('#np-no').value.trim(),cls:c?c.value:''});save();toast(nm+'を追加しました');render();const i=$('#np-name');if(i)i.focus();}
  else if(f==='start'){const pid=ui.pick||(D.players.length===1?D.players[0].id:null),date=$('#st-date').value||today(),opp=$('#st-opp').value.trim();
    const go=()=>{D.live={id:uid(),date,opp,cur:pid,hist:[]};ui.pick=null;save();render();},p=pl(pid),st=p&&stat(p,date);
    if(st&&st.blocked)confirmSheet(label(p)+'は'+md(date)+'に投げられない状態です（'+(why(p,st,date)||'上限に達しています')+'）。このまま先発にしますか？','先発にする',go);else go();}
  else if(f==='custom'){const g=id=>{const n=parseInt($(id).value,10);return n>0?String(Math.min(999,n)):'';};D.custom={day:g('#cu-day'),two:g('#cu-two'),week:g('#cu-week')};save();toast('上限を保存しました');render();}
});
document.addEventListener('input',e=>{const el=e.target;if(!D.cq)return;
  if(el.id==='cq-feel'){D.cq.feel=el.value;cqRefresh();}
  else if(el.id==='cq-free'){D.cq.free=el.value;cqRefresh();}
  else if(el.id==='cq-text'){ui.cqEdited=el.value;}   // 質問文を自分で直したら、その文章を送る
  else if(el.dataset.cg==='m'){const g=D.cq.games[+el.dataset.i];if(g){g.m=el.value;cqRefresh();}}});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='st-date'){const c=$('#st-chips');if(c)c.innerHTML=pitcherChips(ui.pick,el.value||today(),'pick');return;}
  if(el.id==='cq-hide'&&D.cq){D.cq.hide=el.checked;ui.cqEdited=null;cqRefresh();return;}
  if(el.dataset&&(el.dataset.cg==='d'||el.dataset.cg==='n')&&D.cq){const g=D.cq.games[+el.dataset.i];if(!g)return;
    if(el.dataset.cg==='d'){if(!el.value||el.value<today()){el.value=g.d;toast('今日より後の日を選んでください');return;}g.d=el.value;}else g.n=+el.value;
    ui.cqEdited=null;cqRefresh();return;}
  if(e.target.id!=='imp'||!e.target.files[0])return;const fr=new FileReader();
  fr.onload=()=>{let d=null;try{d=JSON.parse(fr.result);}catch(_){}
    const c=d&&d.app==='PitchCount'?cleanData(d.data):null;
    if(!c){toast('PitchCountの控えではないようです');return;}
    const skip=(d.data.players.length-c.players.length)+((d.data.outings||[]).length-c.outings.length);
    confirmSheet('控え（投手'+c.players.length+'人・登板'+c.outings.length+'件）に置き換えますか？'+(skip?'（読めない記録'+skip+'件は入れません）':''),'置き換える',()=>{
      try{localStorage.setItem(KEY+'.before-restore',JSON.stringify(D));}catch(_){}   // 置き換える前の記録を1つだけ残しておく
      D=c;save();ui.view='board';toast('控えから戻しました');render();},true);};
  fr.readAsText(e.target.files[0]);e.target.value='';
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet();});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#sheet').hidden)closeSheet();else if(ui.tour)tourEnd();});
addEventListener('resize',()=>{if(ui.tour)tourPlace();});addEventListener('scroll',()=>{if(ui.tour)tourPlace();},{passive:true});
render();
// 一度開いたら、電波がない球場でも開き直せるように（https の公開ページだけ。claude.ai のプレビューでは使わない）
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&window.self===window.top)navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}
}
